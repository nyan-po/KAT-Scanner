    - NOW
    - CRM
    - ADBE
    - PLTR
  Cybersecurity:
    - CRWD
    - PANW
    - ZS
    - NET
  Nuclear and Power:
    - SMR
    - CCJ
    - LEU
    - UEC
    - CEG
